name: UI quality (nightly)

# The slow, non-deterministic guardrail: it starts PostgreSQL, the API and both
# frontends, captures screenshots, and asks a vision model to score them. That
# cost is worth paying on a schedule, not on every push — as part of CI it made
# every PR wait for a check whose verdict is advisory anyway, since the judge has
# roughly +/-2 points of run-to-run variance.
#
# Run it by hand from the Actions tab when a UI change needs the loop.

on:
  schedule:
    # 18:00 UTC daily: 03:30 in Adelaide, so the report is waiting in the morning.
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  ui-quality:
    name: UI quality loop (nightly)
    runs-on: ubuntu-latest
    env:
      LLM_VISION_API_KEY: ${{ secrets.LLM_VISION_API_KEY }}
      LLM_VISION_BASE_URL: ${{ vars.LLM_VISION_BASE_URL || 'https://api.deepseek.com/v1' }}
      LLM_VISION_MODEL: ${{ vars.LLM_VISION_MODEL || 'deepseek-v4-flash-vision-exp' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for a vision key
        id: key
        run: |
          if [ -z "$LLM_VISION_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_VISION_API_KEY is not set — skipping the UI quality loop."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup .NET
        if: steps.key.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        if: steps.key.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/asian-taste-customer/package-lock.json
            src/asian-taste-admin/package-lock.json
      - name: Install root tooling (Playwright capture)
        if: steps.key.outputs.configured == 'true'
        run: npm ci
      - name: Install frontend deps
        if: steps.key.outputs.configured == 'true'
        run: |
          npm ci --prefix src/asian-taste-customer
          npm ci --prefix src/asian-taste-admin
      - name: Start PostgreSQL
        if: steps.key.outputs.configured == 'true'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb AsianTaste_Dev
      - name: Configure the API for the run
        if: steps.key.outputs.configured == 'true'
        run: |
          cd src/AsianTaste.API
          cp appsettings.Development.json.example appsettings.Development.json
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("appsettings.Development.json")
          cfg = json.loads(p.read_text())
          cfg["ConnectionStrings"]["DefaultConnection"] = (
              "Host=localhost;Port=5432;Database=AsianTaste_Dev;Username=postgres;Password=postgres"
          )
          p.write_text(json.dumps(cfg, indent=2))
          PY
      - name: Start the API
        if: steps.key.outputs.configured == 'true'
        run: |
          cd src/AsianTaste.API
          nohup dotnet run --no-launch-profile --urls http://localhost:5070 > /tmp/api.log 2>&1 &
      - name: Start the frontends
        if: steps.key.outputs.configured == 'true'
        run: |
          nohup npm run dev --prefix src/asian-taste-customer > /tmp/customer.log 2>&1 &
          nohup npm run dev --prefix src/asian-taste-admin    > /tmp/admin.log 2>&1 &
      - name: Wait for the servers
        if: steps.key.outputs.configured == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5070/api/menu >/dev/null \
               && curl -sf http://localhost:5173 >/dev/null \
               && curl -sf http://localhost:5174 >/dev/null; then
              echo "All servers are up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Servers did not come up in time."
          tail -30 /tmp/api.log || true
          exit 1
      - name: Capture screenshots
        if: steps.key.outputs.configured == 'true'
        run: npm run ui:shots
      - name: Judge screenshots
        if: steps.key.outputs.configured == 'true'
        env:
          UI_QA_FAIL_ON_HIGH: "0"
        run: |
          if [ "$UI_QA_FAIL_ON_HIGH" = "1" ]; then
            npm run ui:judge -- --fail-on-high
          else
            npm run ui:judge
          fi
          {
            echo "## UI quality report"
            echo
            cat ui-shots/ui-qa-report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the shots and report
        if: always() && steps.key.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa
          path: ui-shots/
          retention-days: 14
      - name: Show server logs on failure
        if: failure() && steps.key.outputs.configured == 'true'
        run: |
          echo "=== api ===";      tail -40 /tmp/api.log      || true
          echo "=== customer ==="; tail -20 /tmp/customer.log || true
          echo "=== admin ===";    tail -20 /tmp/admin.log    || true
