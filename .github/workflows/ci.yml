name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AsianTaste.sln

      - name: Build
        run: dotnet build AsianTaste.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AsianTaste.sln --no-build --configuration Release --verbosity normal

      - name: Verify test wiring
        # Fails when a tracked test file cannot actually run — e.g. a spec whose
        # runner is not installed, or a test project missing from the solution.
        # Guards against the checkout.spec.ts class of "fake coverage".
        run: ./scripts/check-test-wiring.sh

      - name: Verify test health
        # Fails when the suite passes but proves nothing: skipped tests, an
        # assertion-free test file, zero tests run, or a suite that shrank
        # below .test-baseline. This is the "do not fail quietly" guardrail.
        run: ./scripts/check-test-health.sh

  guardrails:
    name: Guardrails (CI integrity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change-size check has a real diff base.
          fetch-depth: 0

      - name: Verify CI integrity
        # Fails when the guardrails themselves are weakened (a blocking step
        # gains continue-on-error, a guardrail script is deleted, the workflow
        # stops triggering), or when a change is too large to review reliably.
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-ci-integrity.sh

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [asian-taste-customer, asian-taste-admin]

    defaults:
      run:
        working-directory: src/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Non-blocking: there is pre-existing lint debt (unused vars, explicit
        # any, react-refresh) tracked in MAJOR_UPDATE_PLAN.md. Reports issues
        # without failing CI until that debt is cleared.
        run: npm run lint
        continue-on-error: true

      - name: Build (typecheck + bundle)
        run: npm run build
