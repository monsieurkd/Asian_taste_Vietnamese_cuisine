name: CI

on:
  push:
    branches: [ main ]
    # ui-shots/ is the screenshot output of the nightly UI quality run. A commit
    # that only refreshes those images cannot change behaviour, so it does not
    # need a full API + frontend build.
    paths-ignore:
      - 'ui-shots/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'ui-shots/**'
  workflow_dispatch:

env:
  # Where the API test run writes TRX. The test-health guardrail reads it from
  # here instead of running the suite a second time; see the Test step below.
  TEST_RESULTS_DIR: TestResults

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # The restore is lock-free, so any project file can change the graph.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AsianTaste.sln

      - name: Build
        run: dotnet build AsianTaste.sln --no-restore --configuration Release

      - name: Test
        # TRX goes to $TEST_RESULTS_DIR so the test-health guardrail below can
        # judge this run instead of paying for a second one.
        run: >
          dotnet test AsianTaste.sln --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=api-tests.trx"
          --results-directory "$TEST_RESULTS_DIR"

      - name: Verify test wiring
        # Fails when a tracked test file cannot actually run — e.g. a spec whose
        # runner is not installed, or a test project missing from the solution.
        # Guards against the checkout.spec.ts class of "fake coverage".
        run: ./scripts/check-test-wiring.sh

      - name: Verify test health
        # Fails when the suite passes but proves nothing: skipped tests, an
        # assertion-free test file, zero tests run, or a suite that shrank
        # below .test-baseline. This is the "do not fail quietly" guardrail.
        #
        # It reads the TRX from the Test step rather than running the suite
        # again, so this costs milliseconds instead of a full rebuild + run.
        run: ./scripts/check-test-health.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: ${{ env.TEST_RESULTS_DIR }}/
          retention-days: 7
          if-no-files-found: warn

  guardrails:
    name: Guardrails (CI integrity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the change-size check has a real diff base.
          fetch-depth: 0

      - name: Verify CI integrity
        # Fails when the guardrails themselves are weakened (a blocking step
        # gains continue-on-error, a guardrail script is deleted, the workflow
        # stops triggering), or when a change is too large to review reliably.
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-ci-integrity.sh

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [ asian-taste-customer, asian-taste-admin ]

    defaults:
      run:
        working-directory: src/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Blocking: both frontends are lint-clean (the earlier debt was cleared
        # when the UI work was done). Any new lint problem fails the build.
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (typecheck + bundle)
        run: npm run build
