name: Deploy

# Deploys on every push to main — the same event the CI workflow runs on, so a
# red CI run and a green deploy cannot diverge.
#
# Why this is a separate file rather than jobs appended to ci.yml:
#   ci.yml also triggers on pull_request, and a deploy job living there would
#   either run on PRs (bad) or need an `if` on every job to stop it (easy to
#   get wrong). Splitting the files makes "deploys only from main" structural
#   rather than conditional.
#
# It does NOT re-run the test suite. CI is the gate: this workflow waits for CI
# to be green on the same commit before deploying. Running the tests twice would
# double build minutes for no extra safety.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo. No write scopes,
# so a compromised action here cannot push commits or edit releases.
permissions:
  contents: read

# One deploy at a time. If two commits land close together, the second waits
# rather than racing the first — an interleaved deploy can leave the API and
# the frontend running different versions.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate: wait for the CI workflow to pass on this exact commit.
  # ---------------------------------------------------------------------------
  await-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    # actions: read is required to query the CI workflow's run status via the
    # REST API. Without it the default token returns nothing and the wait loop
    # times out instead of deploying.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI workflow to succeed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for CI on ${{ github.sha }}..."

          # Poll the API directly rather than shelling out to `gh run list`.
          #
          # The first version of this used `gh run list --commit ...`, which works
          # interactively but returned nothing on the runner: the default
          # GITHUB_TOKEN does not carry Actions-read permission in this context,
          # and because its stderr was suppressed the loop just spun until its
          # 10-minute timeout — a deploy that silently never starts, which is
          # worse than one that fails. Hitting the REST API with an explicit
          # `permissions` grant below removes the ambiguity.
          #
          # The job-level `permissions:` block grants actions: read for exactly
          # this reason.
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs"

          run_id=""
          conclusion=""
          for attempt in $(seq 1 60); do
            json=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api?head_sha=${{ github.sha }}&per_page=1") || json=""

            # Surface a real API error instead of looping over it.
            #
            # Check for the top-level "message" key specifically. An earlier
            # version grepped the whole body for `"message"`, which also matches
            # the commit message inside a perfectly good workflow_run — so a
            # successful call was reported as "GitHub API refused the request".
            if ! echo "$json" | python3 -c 'import json,sys; sys.exit(0 if "workflow_runs" in json.load(sys.stdin) else 1)' 2>/dev/null; then
              echo "::error::GitHub API call failed or returned no workflow_runs: $(echo "$json" | head -c 300)"
              exit 1
            fi

            run_id=$(echo "$json" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("workflow_runs") or []; print(d[0]["id"] if d else "")')
            status=$(echo "$json" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("workflow_runs") or []; print(d[0]["status"] if d else "")')
            conclusion=$(echo "$json" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("workflow_runs") or []; print((d[0].get("conclusion") or "") if d else "")')

            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              echo "CI run $run_id completed with conclusion: $conclusion"
              break
            fi

            echo "CI status: ${status:-not started} (attempt $attempt/60)"
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "::error::No CI run found for ${{ github.sha }} after 10 minutes."
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::CI concluded '$conclusion' on ${{ github.sha }} — not deploying."
            exit 1
          fi

          echo "CI is green. Proceeding to deploy."

  # ---------------------------------------------------------------------------
  # API -> Fly.io
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API (Fly.io)
    needs: await-ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy token is configured
        id: config
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set — skipping the API deploy. See docs/DEPLOYMENT.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.config.outputs.configured == 'true'

      - name: Deploy
        if: steps.config.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --remote-only builds on Fly's builders, so the runner needs no Docker
        # and no local image cache — faster and reproducible.
        run: flyctl deploy --remote-only

      - name: Smoke test the deployed API
        if: steps.config.outputs.configured == 'true'
        env:
          API_URL: ${{ vars.API_URL }}
          CUSTOMER_URL: ${{ vars.CUSTOMER_URL }}
        # Delegates to the same script a human runs by hand, so CI and a manual
        # check agree on what "healthy" means. The script covers liveness,
        # readiness, menu content, duplicate dishes, CORS, the production
        # posture of the dev endpoints, and the customer site's SPA routes —
        # all of which have been wrong at some point in this project's history.
        run: ./scripts/check-deployment-health.sh


  # ---------------------------------------------------------------------------
  # Customer app -> Vercel. The admin app is deliberately NOT deployed here.
  # ---------------------------------------------------------------------------
  deploy-customer:
    name: Deploy customer app (Vercel)
    needs: await-ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check the Vercel token is configured
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set — skipping the frontend deploy."
            echo "Vercel's own Git integration will deploy on push instead."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the Vercel CLI
        if: steps.config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CUSTOMER_PROJECT_ID }}
        # The CLI must run from the app's Root Directory: `vercel pull` writes a
        # .vercel/ link file into the working directory, and the build has to
        # happen where the project's package.json is. Running it from the repo
        # root fails with "Could not retrieve Project Settings" because the
        # project's root directory is src/asian-taste-customer.
        #
        # --environment=production pulls the Production env vars, which is what
        # Vite inlines at build time. Pulling "preview" here would bake the wrong
        # API URL into the bundle and every request would 404.
        working-directory: src/asian-taste-customer
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CUSTOMER_PROJECT_ID }}
        working-directory: src/asian-taste-customer
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt output
        if: steps.config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CUSTOMER_PROJECT_ID }}
        working-directory: src/asian-taste-customer
        # --prebuilt reuses the artifact from the step above, so the bundle that
        # was built against the Production env vars is exactly what ships.
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
