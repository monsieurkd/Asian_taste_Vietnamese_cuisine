<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu · Asian Taste staff console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin" data-rail="expanded" id="admin">

  <aside class="admin-rail">
    <div class="rail-top">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z" />
            <path d="M9 7.5c0-1.3 1.1-1.7 1.1-2.8M12.5 7.5c0-1.3 1.1-1.7 1.1-2.8" />
          </svg>
        </span>
        <span class="brand-text"><span class="brand-name">Asian Taste</span><span class="brand-tag">Staff console</span></span>
      </a>
      <button type="button" class="rail-toggle" id="railToggle" aria-expanded="true" aria-controls="adminNav" title="Collapse the sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="railChevron" d="m14 6-6 6 6 6" /></svg>
        <span class="sr-only">Collapse the sidebar</span>
      </button>
    </div>

    <nav class="admin-nav" id="adminNav" aria-label="Staff sections">
      <a href="index.html" title="Overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" /><path d="M6 10v9h12v-9" /></svg><span>Overview</span>
      </a>
      <a href="kitchen-board.html" title="Board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.5" /></svg><span>Board</span>
      </a>
      <a href="counter-order-pos.html" title="Counter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" /><path d="M3.5 9h17M8 4.5v15" /></svg><span>Counter</span>
      </a>
      <a href="orders.html" title="Orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13" /><circle cx="4" cy="6" r="1" /><circle cx="4" cy="12" r="1" /><circle cx="4" cy="18" r="1" /></svg><span>Orders</span>
      </a>
      <a href="menu.html" title="Menu" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM11 4h7.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H11" /></svg><span>Menu</span>
      </a>
    </nav>

    <div class="admin-rail-foot">
      <span class="live-dot" id="liveDot" title="Kitchen online">Kitchen online</span>
      <div class="admin-account">
        <button type="button" class="admin-account-btn" id="accountBtn" aria-expanded="false" aria-haspopup="menu">
          <span class="avatar" aria-hidden="true">LT</span>
          <span class="ac-text"><strong>Linh Tran</strong><span class="ac-role">Manager</span></span>
          <span class="ac-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 5.5 6-5.5" /></svg></span>
        </button>
        <div class="admin-account-menu" id="accountMenu" role="menu" hidden>
          <a role="menuitem" class="is-danger" href="login.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5" /><path d="M4 12h10M11 8l4 4-4 4" /></svg>
            Sign out
          </a>
        </div>
      </div>
      <a class="admin-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5" /><path d="M4 12h10M11 8l4 4-4 4" /></svg>
        <span>Back to site</span>
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <div>
        <h1>Menu</h1>
        <p class="sub" id="menuSub">82 dishes across 14 categories. Toggle availability the moment the kitchen runs out.</p>
      </div>
      <div class="admin-top-actions">
        <span class="admin-clock" id="adminClock" title="The shop clock — Australia/Adelaide">Adelaide —</span>
      </div>
    </header>

    <div class="admin-page page-wide" data-od-id="menu">

      <section class="panel" data-od-id="menu-tools">
        <div class="panel-body">
          <div class="filterbar">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4 4" /></svg>
              <label class="sr-only" for="dish-filter">Search dishes</label>
              <input id="dish-filter" class="input" type="search" placeholder="Search dishes…" autocomplete="off" />
            </div>
            <button type="button" class="btn btn-secondary" id="clearFilters">Clear filters</button>
          </div>
          <div class="seg-sm" id="catFilters" role="group" aria-label="Filter by category" style="margin-top:12px"></div>
          <p class="meta" id="menuCount" aria-live="polite" style="margin:12px 0 0"></p>
        </div>
      </section>

      <section class="panel" data-od-id="menu-list">
        <div class="panel-head">
          <h3>Dishes</h3>
          <span class="pill pill-neutral">Availability writes through to the kitchen</span>
        </div>
        <div class="panel-body" id="dishList" style="padding:0"></div>
      </section>
    </div>
  </div>
</div>

<!-- Dish editor -->
<button type="button" class="modal-scrim" id="modalScrim" aria-label="Close" hidden></button>
<div class="modal-shell" id="modalShell" role="dialog" aria-modal="true" aria-labelledby="dishEditorTitle" hidden>
  <div class="panel modal-panel" id="modalPanel" tabindex="-1">
    <div class="panel-head">
      <h3 id="dishEditorTitle">Dish</h3>
      <button type="button" class="icon-btn" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="panel-body" id="modalBody"></div>
    <div class="panel-foot row-between" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var AUD = new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD" });
  function money(n) { return AUD.format(n || 0); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initials(name) {
    return name.replace(/[^a-zA-Z0-9 ]/g, "").split(" ").filter(Boolean).slice(0, 2)
      .map(function (w) { return w[0].toUpperCase(); }).join("");
  }
  var TZ_TIME = new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Adelaide", hour: "numeric", minute: "2-digit" });
  function fmtTime(ms) { return TZ_TIME.format(new Date(ms)).replace(/[\u202f\u00a0]/g, " "); }

  /* ─── the real catalog (02_seed_data.sql — 14 categories, 82 dishes) ─── */
  var CATEGORY_ORDER = ["Starters", "Banh Mi", "Noodle Soup", "Noodle Bowl Salad", "Noodle Stir-Fry",
    "Rice Bowl", "Rice Dishes", "Chicken Dishes", "Pork Dishes", "Salt & Pepper",
    "Beef Dishes", "Seafood Dishes", "Vegetable Dishes", "Super Deals"];

  var RAW = [
    [1, "Starters", "Cold rolls (serve of 4)", 8.50], [2, "Starters", "Homemade Dimsim (serve of 3)", 6.00],
    [3, "Starters", "Satay skewers (serve of 3)", 7.80], [4, "Starters", "Spring roll (serve of 3)", 5.80],
    [5, "Starters", "Prawn Spring roll (serve of 3)", 6.00], [6, "Starters", "Homemade wonton", 6.50],
    [7, "Starters", "Laksa soup", 7.80], [8, "Starters", "Sweet corn soup", 7.80],
    [9, "Banh Mi", "Tofu Banh Mi", 8.00], [10, "Banh Mi", "Red Pork Banh Mi", 8.00],
    [11, "Banh Mi", "Grilled Chicken Banh Mi", 8.20], [12, "Banh Mi", "Lemongrass Chicken Banh Mi", 8.50],
    [13, "Banh Mi", "Crispy Pork (Roasted Pork) Banh Mi", 8.50], [14, "Banh Mi", "Satay Chicken Banh Mi", 8.50],
    [15, "Banh Mi", "Lemongrass Beef Banh Mi", 8.50], [16, "Banh Mi", "Combination Banh Mi", 9.00],
    [17, "Noodle Soup", "Pho - Beef noodle soup (1 choice)", 15.50], [18, "Noodle Soup", "Pho - Beef noodle soup (Combo)", 16.50],
    [19, "Noodle Soup", "Spicy beef noodle soup", 16.50], [20, "Noodle Soup", "Chicken noodle soup", 15.50],
    [21, "Noodle Soup", "Wonton noodle soup", 15.50], [22, "Noodle Soup", "Laksa noodle soup - Vegan", 15.50],
    [23, "Noodle Soup", "Laksa noodle soup - Chicken", 16.50], [24, "Noodle Soup", "Laksa noodle soup - Crispy pork", 16.50],
    [25, "Noodle Soup", "Laksa noodle soup - Seafood", 17.00], [26, "Noodle Soup", "Laksa noodle soup - Combination", 17.50],
    [27, "Noodle Bowl Salad", "Tofu Noodle Bowl Salad", 15.00], [28, "Noodle Bowl Salad", "Spring rolls Noodle Bowl Salad", 15.00],
    [29, "Noodle Bowl Salad", "Chicken Noodle Bowl Salad", 15.20], [30, "Noodle Bowl Salad", "Crispy Pork Noodle Bowl Salad", 15.50],
    [31, "Noodle Bowl Salad", "Beef Noodle Bowl Salad", 15.50], [32, "Noodle Bowl Salad", "Combination Noodle Bowl Salad", 16.20],
    [33, "Noodle Stir-Fry", "Pad Thai", 16.00], [34, "Noodle Stir-Fry", "Singapore noodle", 16.00],
    [35, "Noodle Stir-Fry", "Mongolian noodle", 16.00], [36, "Noodle Stir-Fry", "Korean Glass Noodle (Low carb)", 16.00],
    [37, "Noodle Stir-Fry", "Wok-tossed soft egg noodle - Vegan", 16.80], [38, "Noodle Stir-Fry", "Wok-tossed soft egg noodle - Chicken / Beef", 17.80],
    [39, "Noodle Stir-Fry", "Wok-tossed soft egg noodle - Seafood", 19.20], [40, "Noodle Stir-Fry", "Wok-tossed soft egg noodle - Combo", 19.50],
    [41, "Rice Bowl", "Rice Bowl - Lemongrass Tofu", 14.50], [42, "Rice Bowl", "Rice Bowl - Crispy Chicken or Pork", 14.80],
    [43, "Rice Bowl", "Rice Bowl - Satay Chicken", 14.80], [44, "Rice Bowl", "Rice Bowl - Spicy chicken", 14.80],
    [45, "Rice Bowl", "Rice Bowl - Garlic butter chicken", 14.80], [46, "Rice Bowl", "Rice Bowl - Soy-pepper Beef", 14.80],
    [47, "Rice Bowl", "Rice Bowl - Sunny egg & Crispy pork", 15.80], [48, "Rice Bowl", "Rice Bowl - Curry (Green/Yellow)", 16.00],
    [49, "Rice Dishes", "Steamed rice", 2.00], [50, "Rice Dishes", "Fried rice", 11.50],
    [51, "Rice Dishes", "Spicy basil fried rice", 12.50], [52, "Rice Dishes", "Japanese fried rice", 12.50],
    [53, "Rice Dishes", "Asian taste rice hotpot", 17.90],
    [54, "Chicken Dishes", "Mix veg cashew nut (Chicken)", 19.00], [55, "Chicken Dishes", "Mix veg in creamy satay sauce (Chicken)", 19.00],
    [56, "Chicken Dishes", "Mix veg in Malaysian curry (Chicken)", 19.00], [57, "Chicken Dishes", "Mix veg with spicy chilli basil (Chicken)", 19.00],
    [58, "Chicken Dishes", "Honey Chicken", 18.00], [59, "Chicken Dishes", "Mix veg in Thai green curry (Chicken)", 19.00],
    [60, "Pork Dishes", "Vietnamese crispy pork", 18.50], [61, "Pork Dishes", "Sweet & Sour pork", 18.50],
    [62, "Salt & Pepper", "Salt & Pepper Tofu", 16.50], [63, "Salt & Pepper", "Salt & Pepper Chicken", 18.00],
    [64, "Salt & Pepper", "Salt & Pepper Squid / Fish", 18.50], [65, "Salt & Pepper", "Salt & Pepper Prawn", 19.80],
    [66, "Salt & Pepper", "Salt & Pepper Combination", 21.50],
    [67, "Beef Dishes", "Mix veg in cashew nut (Beef)", 19.80], [68, "Beef Dishes", "Mix veg in black bean sauce (Beef)", 19.80],
    [69, "Beef Dishes", "Mix veg in Mongolian sauce (Beef)", 19.80], [70, "Beef Dishes", "Mix veg with spicy chilli basil (Beef)", 19.80],
    [71, "Beef Dishes", "Mix veg with black pepper (Beef)", 19.80],
    [72, "Seafood Dishes", "Combo seafood ginger hotpot", 20.80], [73, "Seafood Dishes", "Prawn hotpot in Asian spices", 20.80],
    [74, "Seafood Dishes", "Creamy garlic prawn", 20.80], [75, "Seafood Dishes", "Prawn curry (Green/Yellow)", 20.80],
    [76, "Vegetable Dishes", "Mix veg cashew nut", 15.00], [77, "Vegetable Dishes", "Green bean in soy and garlic", 15.50],
    [78, "Vegetable Dishes", "Veg tofu hotpot", 16.50], [79, "Vegetable Dishes", "Tofu chilli lemongrass", 15.00],
    [80, "Vegetable Dishes", "Steamed bokchoy in oyster garlic sauce", 15.00], [81, "Vegetable Dishes", "Vegan curry (Green/Yellow)", 16.50],
    [82, "Super Deals", "Snack Super Deal", 5.20]
  ];
  var CATEGORY_ID = {};
  CATEGORY_ORDER.forEach(function (c, i) { CATEGORY_ID[c] = i + 1; });

  /* Availability + edits persist here; the Counter reads this too, so a dish taken off
     the menu disappears from the till as well as the board. */
  var MENU_KEY = "asiantaste.admin.menu.v1";
  function readMenuStore() { try { var r = localStorage.getItem(MENU_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function writeMenuStore(s) { try { localStorage.setItem(MENU_KEY, JSON.stringify(s)); } catch (e) {} }

  /* Three dishes start off the menu so the state is visible on first load. */
  var DEFAULT_OFF = [26, 73, 82];

  var items = RAW.map(function (r) {
    return { id: r[0], categoryName: r[1], categoryId: CATEGORY_ID[r[1]], name: r[2], price: r[3], spicyLevel: 0, description: "", isAvailable: DEFAULT_OFF.indexOf(r[0]) === -1 };
  });

  function applyOverrides() {
    var s = readMenuStore();
    if (!s) return;
    items.forEach(function (it) {
      var o = s[it.id];
      if (!o) return;
      if (o.name != null) it.name = o.name;
      if (o.price != null) it.price = o.price;
      if (o.spicyLevel != null) it.spicyLevel = o.spicyLevel;
      if (o.description != null) it.description = o.description;
      if (o.categoryName != null) { it.categoryName = o.categoryName; it.categoryId = CATEGORY_ID[o.categoryName] || it.categoryId; }
      if (o.isAvailable != null) it.isAvailable = o.isAvailable;
    });
  }
  function saveOverride(id, patch) {
    var s = readMenuStore() || {};
    s[id] = Object.assign({}, s[id], patch);
    writeMenuStore(s);
  }

  /* ─── state ─── */
  var state = { query: "", category: "all", editing: null };
  var listEl = document.getElementById("dishList");
  var countEl = document.getElementById("menuCount");
  var catEl = document.getElementById("catFilters");
  var searchEl = document.getElementById("dish-filter");
  var subEl = document.getElementById("menuSub");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add("is-open"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("is-open"); }, 2200); }

  function offCount() { return items.filter(function (i) { return !i.isAvailable; }).length; }

  function filtered() {
    var q = state.query.trim().toLowerCase();
    return items.filter(function (it) {
      if (state.category !== "all" && it.categoryName !== state.category) return false;
      if (q && it.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  /* ─── render ─── */
  function renderCats() {
    catEl.innerHTML = '<button type="button" data-cat="all" aria-pressed="' + (state.category === "all") + '">All</button>' +
      CATEGORY_ORDER.map(function (c) {
        return '<button type="button" data-cat="' + esc(c) + '" aria-pressed="' + (state.category === c) + '">' + esc(c) + "</button>";
      }).join("");
  }

  function rowHTML(it) {
    var heat = it.spicyLevel > 0 ? " · heat " + it.spicyLevel + "/5" : "";
    return '<div class="mm-row" data-id="' + it.id + '">' +
      '<span class="mm-thumb"><span class="ph-mono" aria-hidden="true">' + esc(initials(it.name)) + "</span></span>" +
      "<div><strong style=\"font-size:15px\">" + esc(it.name) + "</strong>" +
        '<p class="meta" style="margin:2px 0 0">' + esc(it.categoryName) + heat + "</p>" +
        (!it.isAvailable ? '<p class="field-error" style="margin:4px 0 0">Off menu right now</p>' : "") +
      "</div>" +
      '<span class="num mm-hide" style="font-weight:700;font-variant-numeric:tabular-nums">' + money(it.price) + "</span>" +
      '<label class="switch"><input type="checkbox" data-toggle="' + it.id + '"' + (it.isAvailable ? " checked" : "") +
        ' aria-label="Mark ' + esc(it.name) + " " + (it.isAvailable ? "unavailable" : "available") + '" />' +
        '<span class="track" aria-hidden="true"></span>' +
        '<span class="switch-label" style="font-size:12px">' + (it.isAvailable ? "Available" : "Off") + "</span></label>" +
      '<button type="button" class="icon-btn" data-edit="' + it.id + '" aria-label="Edit ' + esc(it.name) + '">' +
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>' +
      "</button></div>";
  }

  function render() {
    var rows = filtered();
    countEl.innerHTML = "Showing " + rows.length + " of " + items.length + " dishes · " + offCount() + " off the menu";
    subEl.textContent = items.length + " dishes across " + CATEGORY_ORDER.length + " categories. Toggle availability the moment the kitchen runs out.";

    if (!rows.length) {
      listEl.innerHTML = '<div class="state-block"><span class="state-icon">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></span>' +
        "<h3>No dishes match</h3><p>Try another category or a shorter search.</p></div>";
      return;
    }
    listEl.innerHTML = rows.map(rowHTML).join("");
  }

  /* ─── editor dialog ─── */
  var modalScrim = document.getElementById("modalScrim");
  var modalShell = document.getElementById("modalShell");
  var modalPanel = document.getElementById("modalPanel");
  var modalBody = document.getElementById("modalBody");
  var modalFoot = document.getElementById("modalFoot");
  var modalTitle = document.getElementById("dishEditorTitle");

  function openEditor(id) {
    var it = null;
    items.forEach(function (x) { if (x.id === id) it = x; });
    if (!it) return;
    state.editing = it;
    modalTitle.textContent = it.name;
    modalBody.innerHTML =
      '<p class="meta" style="margin:0 0 16px">' + esc(it.categoryName) + " · changes go live immediately</p>" +
      '<div class="dl-form">' +
        '<div class="field span2"><label for="de-name" style="font-size:12px;font-weight:800">Name</label>' +
          '<input id="de-name" class="input" value="' + esc(it.name) + '" /></div>' +
        '<div class="field"><label for="de-price" style="font-size:12px;font-weight:800">Price (AUD, GST included)</label>' +
          '<input id="de-price" class="input" type="number" step="0.01" min="0" inputmode="decimal" value="' + it.price.toFixed(2) + '" />' +
          '<p class="hint">The printed menu carries a GST-inclusive price, and so does the app.</p></div>' +
        '<div class="field"><label for="de-cat" style="font-size:12px;font-weight:800">Section</label>' +
          '<select id="de-cat" class="input">' + CATEGORY_ORDER.map(function (c) {
            return '<option value="' + esc(c) + '"' + (c === it.categoryName ? " selected" : "") + ">" + esc(c) + "</option>";
          }).join("") + "</select></div>" +
        '<div class="field span2"><label for="de-heat" style="font-size:12px;font-weight:800">Heat</label>' +
          '<select id="de-heat" class="input">' +
            ["0|Not spicy", "1|Mild", "2|Medium", "3|Hot"].map(function (o) {
              var p = o.split("|");
              return '<option value="' + p[0] + '"' + (String(it.spicyLevel) === p[0] ? " selected" : "") + ">" + p[1] + "</option>";
            }).join("") + "</select></div>" +
        '<div class="field span2"><label for="de-desc" style="font-size:12px;font-weight:800">Description <span class="hint">(optional)</span></label>' +
          '<textarea id="de-desc" class="input" rows="3">' + esc(it.description) + "</textarea></div>" +
      "</div>";

    modalFoot.innerHTML =
      '<p class="meta" style="margin:0;max-width:36ch">Sold out? Use the switch on the menu — reversible in one press.</p>' +
      '<div style="display:flex;gap:8px;margin-left:auto">' +
        '<button type="button" class="btn btn-secondary" id="de-cancel">Cancel</button>' +
        '<button type="button" class="btn btn-primary" id="de-save">Save</button>' +
      "</div>";

    modalScrim.hidden = false;
    modalShell.hidden = false;
    document.body.classList.add("is-locked");
    modalPanel.focus({ preventScroll: true });
  }

  function closeEditor() {
    state.editing = null;
    modalScrim.hidden = true;
    modalShell.hidden = true;
    document.body.classList.remove("is-locked");
  }

  function saveEditor() {
    var it = state.editing;
    if (!it) return;
    var name = document.getElementById("de-name").value.trim();
    var price = Number(document.getElementById("de-price").value);
    var categoryName = document.getElementById("de-cat").value;
    var spicyLevel = Number(document.getElementById("de-heat").value);
    var description = document.getElementById("de-desc").value.trim();

    if (!name) { toast("A dish needs a name"); return; }
    if (Number.isNaN(price) || price < 0) { toast("Enter a price of 0 or more"); return; }

    it.name = name; it.price = price; it.categoryName = categoryName; it.categoryId = CATEGORY_ID[categoryName];
    it.spicyLevel = spicyLevel; it.description = description;
    saveOverride(it.id, { name: name, price: price, categoryName: categoryName, spicyLevel: spicyLevel, description: description });
    closeEditor();
    render();
    toast(name + " saved");
  }

  /* ─── events ─── */
  searchEl.addEventListener("input", function (e) { state.query = e.target.value; render(); });
  catEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    state.category = b.getAttribute("data-cat");
    renderCats(); render();
  });
  document.getElementById("clearFilters").addEventListener("click", function () {
    state.query = ""; state.category = "all"; searchEl.value = ""; renderCats(); render();
  });
  listEl.addEventListener("click", function (e) {
    var ed = e.target.closest("[data-edit]");
    if (ed) { openEditor(Number(ed.getAttribute("data-edit"))); return; }
  });
  listEl.addEventListener("change", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (!t) return;
    var id = Number(t.getAttribute("data-toggle"));
    var it = null; items.forEach(function (x) { if (x.id === id) it = x; });
    if (!it) return;
    it.isAvailable = t.checked;
    saveOverride(id, { isAvailable: it.isAvailable });
    render();
    toast(it.isAvailable ? "Back on the menu" : "Off the menu");
  });
  modalScrim.addEventListener("click", closeEditor);
  document.getElementById("modalClose").addEventListener("click", closeEditor);
  modalFoot.addEventListener("click", function (e) {
    if (e.target.closest("#de-cancel")) closeEditor();
    else if (e.target.closest("#de-save")) saveEditor();
  });
  document.addEventListener("keydown", function (e) {
    if (modalShell.hidden) return;
    if (e.key === "Escape") { closeEditor(); return; }
    if (e.key === "Enter" && (e.target.tagName !== "TEXTAREA")) { e.preventDefault(); saveEditor(); return; }
    if (e.key !== "Tab") return;
    var focusable = Array.prototype.filter.call(
      modalPanel.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'),
      function (el) { return el.offsetParent !== null; }
    );
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* rail collapse + account menu */
  document.getElementById("railToggle").addEventListener("click", function () {
    var admin = document.getElementById("admin");
    var collapsed = admin.getAttribute("data-rail") === "collapsed";
    admin.setAttribute("data-rail", collapsed ? "expanded" : "collapsed");
    this.setAttribute("aria-expanded", String(collapsed));
    document.getElementById("railChevron").setAttribute("d", collapsed ? "m14 6-6 6 6 6" : "m10 6 6 6-6 6");
  });
  document.getElementById("accountBtn").addEventListener("click", function () {
    var menu = document.getElementById("accountMenu");
    var open = menu.hidden; menu.hidden = !open; this.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".admin-account")) {
      document.getElementById("accountMenu").hidden = true;
      document.getElementById("accountBtn").setAttribute("aria-expanded", "false");
    }
  });

  var clockEl = document.getElementById("adminClock");
  function renderClock() { if (clockEl) clockEl.textContent = "Adelaide " + fmtTime(Date.now()); }
  setInterval(renderClock, 30000);

  /* ─── boot ─── */
  applyOverrides();
  renderClock();
  renderCats();
  render();
})();
</script>
</body>
</html>
