<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board — Asian Taste staff console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ==========================================================================
     Design tokens — the same locked set as asian-taste-admin/src/index.css.
     Cream content, deep-brown rail, maroon actions, gold highlight.
     Display = Plus Jakarta Sans · Body = Manrope.
     ========================================================================== */
  :root {
    --color-bg: #f5f0e6;
    --color-surface: #ffffff;
    --color-fg: #3c2a21;
    --color-muted: color-mix(in oklch, var(--color-fg) 66%, var(--color-bg));
    --color-border: #e8dcc8;
    --color-accent: #8b3a3a;

    --color-gold: #d4af37;
    --color-deal: #c30139;
    --color-spicy: #ff5722;
    --color-gf: #4caf50;

    --color-accent-soft: color-mix(in oklch, var(--color-accent) 12%, transparent);
    --color-accent-line: color-mix(in oklch, var(--color-accent) 30%, var(--color-border));
    --color-fg-soft: color-mix(in oklch, var(--color-fg) 6%, transparent);
    --color-fg-line: color-mix(in oklch, var(--color-fg) 22%, transparent);
    --color-gold-soft: color-mix(in oklch, var(--color-gold) 20%, transparent);
    --color-on-dark: color-mix(in oklch, var(--color-surface) 84%, transparent);
    --color-on-dark-dim: color-mix(in oklch, var(--color-surface) 64%, transparent);

    --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

    --radius-sm: 8px;
    --radius: 10px;
    --radius-lg: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: var(--color-border); }
  html { -webkit-text-size-adjust: 100%; line-height: 1.5; }
  body {
    margin: 0; min-height: 100vh;
    background-color: var(--color-bg); color: var(--color-fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 600; color: var(--color-fg); margin: 0; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  a { color: inherit; text-decoration: inherit; }
  img, svg { display: block; }
  button { font: inherit; color: inherit; background-color: transparent; background-image: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  /* Author `display` rules (.modal-shell, .admin-account-menu) otherwise beat the UA
     `[hidden] { display: none }`, so hidden dialogs leaked on load. */
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .meta { font-size: 13px; color: var(--color-muted); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ─── console shell ───────────────────────────────────────────────────── */
  .admin { min-height: 100vh; display: grid; grid-template-columns: 244px 1fr; background: var(--color-bg); }
  .admin[data-rail='collapsed'] { grid-template-columns: 68px 1fr; }
  @media (prefers-reduced-motion: no-preference) { .admin { transition: grid-template-columns 0.16s ease; } }

  .rail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-toggle {
    flex: none; display: grid; place-items: center; width: 32px; height: 32px;
    border: 1px solid color-mix(in oklch, var(--color-surface) 24%, transparent);
    border-radius: var(--radius-sm, 8px);
    background: transparent; color: var(--color-on-dark-dim); cursor: pointer;
  }
  .rail-toggle:hover { color: var(--color-surface); border-color: color-mix(in oklch, var(--color-surface) 48%, transparent); }
  .rail-toggle svg { width: 18px; height: 18px; }
  .admin[data-rail='collapsed'] .admin-rail { padding: 18px 10px; gap: 18px; align-items: center; }
  .admin[data-rail='collapsed'] .brand-text,
  .admin[data-rail='collapsed'] .admin-nav a span,
  .admin[data-rail='collapsed'] .admin-account .ac-text,
  .admin[data-rail='collapsed'] .admin-account .ac-chev,
  .admin[data-rail='collapsed'] .admin-back span { display: none; }
  .admin[data-rail='collapsed'] .admin-nav a { justify-content: center; padding: 11px 0; }
  .admin[data-rail='collapsed'] .admin-account-btn { justify-content: center; padding: 6px; }

  .admin-rail {
    background: var(--color-fg); color: var(--color-on-dark);
    display: flex; flex-direction: column; gap: 22px; padding: 20px 16px;
    position: sticky; top: 0; height: 100dvh; overflow-y: auto;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .admin-rail .brand-name { color: var(--color-surface); font-weight: 700; font-size: 15px; }
  .admin-rail .brand-tag { color: var(--color-on-dark-dim); font-size: 11px; }
  .admin-rail .brand-mark { color: var(--color-gold); }
  .brand-mark svg { width: 26px; height: 26px; }

  .admin-nav { display: flex; flex-direction: column; gap: 4px; }
  .admin-nav a {
    display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: var(--radius-sm, 8px);
    color: var(--color-on-dark); font-size: 14px; font-weight: 600; min-height: 44px;
  }
  .admin-nav a svg { width: 19px; height: 19px; flex: none; opacity: 0.85; }
  .admin-nav a:hover { background: color-mix(in oklch, var(--color-surface) 10%, transparent); color: var(--color-surface); }
  .admin-nav a[aria-current='page'] { background: var(--color-accent); color: var(--color-surface); }

  .admin-rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .admin-account { position: relative; }
  .admin-account-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
    border: 1px solid color-mix(in oklch, var(--color-surface) 14%, transparent);
    border-radius: var(--radius-sm, 8px); cursor: pointer;
    background: color-mix(in oklch, var(--color-surface) 8%, transparent);
    color: var(--color-on-dark); text-align: left;
  }
  .admin-account-btn:hover { background: color-mix(in oklch, var(--color-surface) 14%, transparent); }
  .admin-account-btn[aria-expanded='true'] { border-color: color-mix(in oklch, var(--color-gold) 55%, transparent); background: color-mix(in oklch, var(--color-surface) 14%, transparent); }
  .admin-account-btn .ac-text { min-width: 0; flex: 1; }
  .admin-account-btn strong { display: block; font-size: 13px; color: var(--color-surface); }
  .admin-account-btn .ac-role { display: block; font-size: 11px; color: var(--color-on-dark-dim); }
  .admin-account-btn .ac-chev { width: 16px; height: 16px; flex: none; color: var(--color-on-dark-dim); transition: transform 0.18s ease; }
  .admin-account-btn .ac-chev svg { width: 100%; height: 100%; }
  .admin-account-btn[aria-expanded='true'] .ac-chev { transform: rotate(180deg); }
  .admin-account-menu {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 40;
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius);
    box-shadow: 0 18px 44px color-mix(in oklch, var(--color-fg) 20%, transparent); padding: 6px;
    display: flex; flex-direction: column;
  }
  .admin-account-menu button, .admin-account-menu a {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--radius-sm, 7px);
    font-size: 13px; font-weight: 700; color: var(--color-fg); text-align: left; text-decoration: none;
  }
  .admin-account-menu button:hover, .admin-account-menu a:hover { background: var(--color-fg-soft); color: var(--color-accent); }
  .admin-account-menu .is-danger { color: var(--color-accent); }
  .admin-account-menu svg { width: 16px; height: 16px; }
  .admin-back {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; min-height: 40px;
    border: 1px solid color-mix(in oklch, var(--color-surface) 24%, transparent);
    border-radius: var(--radius-sm, 8px);
    font-size: 13px; font-weight: 700; color: var(--color-surface);
  }
  .admin-back svg { width: 17px; height: 17px; }
  .admin-back:hover { background: var(--color-surface); border-color: var(--color-surface); color: var(--color-fg); }

  .live-dot {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--color-gold);
  }
  .live-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--color-gf); animation: pulse 2s infinite; }
  .live-dot.is-off::before { background: var(--color-deal); animation: none; }

  /* The shop clock. The whole board runs on Adelaide time — say so once, plainly. */
  .admin-clock {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 12.5px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--color-fg);
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 6px 13px;
  }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--color-gold); color: var(--color-fg); font-weight: 800; font-size: 13px; flex: none;
  }

  .admin-main { min-width: 0; display: flex; flex-direction: column; height: 100dvh; min-height: 0; overflow: hidden; }
  .admin-top {
    display: flex; align-items: center; justify-content: space-between; gap: 1.25rem;
    padding: 14px clamp(18px, 3vw, 30px);
    border-bottom: 1px solid var(--color-border);
    background: color-mix(in oklch, var(--color-bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    position: sticky; top: 0; z-index: 30; flex: none;
  }
  .admin-top h1 { font-family: var(--font-display); font-size: clamp(21px, 2.4vw, 27px); font-weight: 600; margin: 0; }
  .admin-top .sub { font-size: 12.5px; color: var(--color-muted); margin: 2px 0 0; }
  .admin-top-actions { display: flex; align-items: center; gap: 12px; }
  .admin-page { padding: clamp(14px, 2vw, 24px); display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }

  /* Board fills the console; each column scrolls on its own (the live-scroll fix). */
  .admin-main:has(.board-page) > .admin-page.board-page { overflow: hidden; }

  /* ─── panel / button / pill / input ─── */
  .panel { background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; padding: 20px 22px 0; }
  .panel-body { padding: 18px 20px; }
  .panel-foot { padding: 18px 22px 20px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 11px 20px; border-radius: var(--radius); border: 1px solid transparent;
    font-size: 14px; font-weight: 700; letter-spacing: 0.01em; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn[disabled], .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--color-accent); color: var(--color-surface); border-color: var(--color-accent); }
  .btn-primary:hover { background: color-mix(in oklch, var(--color-accent) 84%, black); border-color: color-mix(in oklch, var(--color-accent) 84%, black); }
  .btn-secondary { background: transparent; color: var(--color-fg); border-color: var(--color-fg-line); }
  .btn-secondary:hover { border-color: var(--color-fg); background: var(--color-fg-soft); }
  .btn-ghost { background: transparent; color: var(--color-fg); border-color: transparent; padding-inline: 10px; min-height: 38px; }
  .btn-ghost:hover { color: var(--color-accent); }
  .btn-block { width: 100%; }
  .btn-link { background: none; border: 0; padding: 0; color: var(--color-accent); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-link:hover { text-decoration: underline; }
  .btn-sm { min-height: 38px; padding: 8px 14px; font-size: 13px; border-radius: var(--radius-sm, 8px); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
    background-color: var(--color-accent-soft); color: var(--color-accent);
    font-size: 12px; font-weight: 800; letter-spacing: 0.03em;
  }
  .pill-neutral { background-color: var(--color-fg-soft); color: var(--color-muted); }

  .input {
    width: 100%; padding: 12px 14px; min-height: 46px; border: 1px solid var(--color-border);
    border-radius: var(--radius); background: var(--color-surface); color: var(--color-fg); font: inherit; font-size: 15px;
  }
  .input:focus { outline: 2px solid var(--color-accent-soft); outline-offset: 0; border-color: var(--color-accent); }
  .counter-note-field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
  .counter-note-field > span { font-weight: 700; color: var(--color-muted); }

  /* Pickup editor — hour and minute lead, because that is what actually moves. */
  .pick { display: flex; flex-direction: column; gap: 14px; }
  .pick-now { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 12.5px; color: var(--color-muted); }
  .pick-now-label { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .pick-now strong { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--color-fg); }
  .pick-tz { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--color-muted); }
  .pick-preview {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background-color: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 16px;
  }
  .pick-time { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .pick-meta { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; color: var(--color-muted); }
  .pick-meta .dot { opacity: 0.55; }
  .pick-was { margin: -6px 0 0; text-align: center; font-size: 12px; color: var(--color-muted); }
  .pick-was strong { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: color-mix(in oklch, var(--color-fg) 78%, var(--color-muted)); }
  .pick-quick { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick-chip {
    flex: 1 1 auto; min-width: 68px; padding: 9px 10px; border-radius: 8px; cursor: pointer;
    background-color: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-fg);
    font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
    transition: border-color 0.12s ease, background-color 0.12s ease;
  }
  .pick-chip:hover { border-color: var(--color-accent); background-color: var(--color-accent-soft); }
  .pick-steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick-step { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .pick-step-label { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-muted); }
  .pick-step-ctl { display: flex; align-items: center; gap: 10px; }
  .pick-round {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 999px; cursor: pointer;
    background-color: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-fg);
    font-size: 22px; font-weight: 700; line-height: 1; transition: border-color 0.12s ease, background-color 0.12s ease;
  }
  .pick-round:hover { border-color: var(--color-accent); background-color: var(--color-accent-soft); }
  .pick-step-val { min-width: 52px; text-align: center; font-family: var(--font-mono); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pick-step-val .pick-ampm { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); margin-left: 3px; }
  .pick-dayrow { display: flex; }
  .pick-dayrow button { flex: 1; }
  .pick-hint { margin: 0; font-size: 12px; color: var(--color-muted); }

  .icon-btn {
    display: inline-grid; place-items: center; width: 42px; height: 42px; flex: none;
    background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius);
    color: var(--color-fg); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { border-color: var(--color-fg); background: var(--color-fg-soft); }
  .icon-btn svg { width: 19px; height: 19px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--color-fg); color: var(--color-surface); padding: 13px 20px; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; box-shadow: 0 18px 44px color-mix(in oklch, var(--color-fg) 20%, transparent);
    z-index: 70; opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
    max-width: calc(100vw - 40px); text-align: center;
  }
  .toast.is-open { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--color-gf) 55%, transparent); }
    70% { box-shadow: 0 0 0 8px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* ==========================================================================
     The board. One compact toolbar, then three stage columns that own their
     own scroll. Nothing else scrolls, so the last column never clips.
     ========================================================================== */
  .board-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px 16px;
    flex-wrap: wrap; flex: none;
  }
  .seg-sm { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--color-fg-soft); padding: 4px; border-radius: 12px; }
  .seg-sm button {
    min-height: 38px; padding: 8px 14px; border: 0; background: transparent; border-radius: 9px;
    font-size: 13px; font-weight: 700; color: var(--color-muted); white-space: nowrap; cursor: pointer;
    display: inline-flex; align-items: center;
  }
  .seg-sm button:hover { color: var(--color-fg); }
  .seg-sm button[aria-pressed='true'] { background: var(--color-surface); color: var(--color-accent); box-shadow: 0 1px 2px color-mix(in oklch, var(--color-fg) 9%, transparent); }
  .seg-count { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; opacity: 0.72; font-variant-numeric: tabular-nums; }

  .board-metrics { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--color-muted); }
  .board-metrics .bm { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .board-metrics .bm strong { color: var(--color-fg); font-weight: 800; font-variant-numeric: tabular-nums; }
  .board-metrics .bm.is-late strong { color: var(--color-deal); }

  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; flex: 1; min-height: 0; align-items: stretch; }

  .col {
    display: flex; flex-direction: column; min-height: 0;
    background: color-mix(in oklch, var(--color-bg) 55%, var(--color-surface));
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .col.drop-target { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
  .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--color-border); flex: none; }
  .col-head h3 { font-size: 14px; letter-spacing: 0.01em; }
  .col-head .count {
    font-size: 12px; font-weight: 800; color: var(--color-muted);
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 999px; padding: 2px 9px;
    font-variant-numeric: tabular-nums;
  }
  .col-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .board-empty { border: 1px dashed var(--color-border); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--color-muted); font-size: 13px; }

  /* ─── the order card ─── */
  .ticket {
    position: relative; background: var(--color-surface); border: 1px solid var(--color-border);
    border-left: 3px solid transparent; border-radius: var(--radius);
    padding: 9px 11px 10px; display: flex; flex-direction: column; gap: 7px;
    box-shadow: 0 1px 2px color-mix(in oklch, var(--color-fg) 5%, transparent);
  }
  .ticket.late { border-left-color: var(--color-deal); }
  .ticket.warn { border-left-color: var(--color-gold); }
  .ticket.held { border-style: dashed; border-left-style: solid; background: color-mix(in oklch, var(--color-gold) 6%, var(--color-surface)); }
  .ticket.is-source { opacity: 0.35; }

  .t-head { display: flex; align-items: center; gap: 8px; }
  .t-grip {
    flex: none; width: 24px; height: 28px; display: grid; place-items: center;
    color: var(--color-muted); border-radius: 6px; cursor: grab; touch-action: none;
  }

  .t-main { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .t-who { min-width: 0; font-size: 13.5px; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-who .t-phone { font-weight: 500; font-size: 11.5px; color: var(--color-muted); margin-left: 5px; }
  .t-total { flex: none; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .t-sub { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--color-muted); flex-wrap: wrap; }
  .t-sub .dot { opacity: 0.55; }

  /* Pickup time — the one line the kitchen runs on, and the way to edit it. */
  .t-time {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid transparent;
    background-color: var(--color-fg-soft); color: var(--color-fg);

  .t-time .t-time-val { font-variant-numeric: tabular-nums; }

  .t-flag { font-size: 10.5px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  .t-flag.hold { background-color: color-mix(in oklch, var(--color-gold) 18%, transparent); color: color-mix(in oklch, var(--color-fg) 80%, var(--color-gold)); }

<script>
(function () {
  "use strict";

  /* ─── helpers ─── */
  var AUD = new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD" });
  function money(n) { return AUD.format(n || 0); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(n) { return new Intl.NumberFormat("en-AU").format(n || 0); }
  function pad(n, len) { n = String(n); while (n.length < len) n = "0" + n; return n; }

  /* ─── Adelaide time ───────────────────────────────────────────────────────
     The shop runs on Australia/Adelaide. Every clock the board prints is
     wall-clock Adelaide, whatever timezone the tablet is set to, so a pickup
     promise reads the same in the kitchen as it does on the counter. */
  var TZ = "Australia/Adelaide";
  var TZ_TIME = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
  var TZ_DAY = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
  var TZ_PARTS = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
  function fmtTime(ms) { return TZ_TIME.format(new Date(ms)).replace(/[\u202f\u00a0]/g, " "); }
  function tzParts(ms) {
    var o = {};
    TZ_PARTS.formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = p.value; });
    return { year: +o.year, month: +o.month, day: +o.day, hour: (+o.hour) % 24, minute: +o.minute };
  }
  /* offset (ms) that turns a UTC instant into Adelaide wall-clock, DST-safe */
  function tzOffsetMs(ms) {
    var t = Math.round(ms / 60000) * 60000, p = tzParts(t);
    return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - t;
  }
  function adelaideISO(y, mo, d, h, mi) {
    var guess = Date.UTC(y, mo - 1, d, h, mi, 0, 0);
    var off = tzOffsetMs(guess);
    var inst = guess - off;
    var off2 = tzOffsetMs(inst);
    if (off2 !== tzOffsetMs(guess)) inst = guess - off2;
    return new Date(inst).toISOString();
  }
  function calendarDayDiff(ms) {
    var a = tzParts(Date.now()), b = tzParts(ms);
    return Math.round((Date.UTC(b.year, b.month - 1, b.day) - Date.UTC(a.year, a.month - 1, a.day)) / 86400000);
  }
  function dayLabel(ms) {
    var d = calendarDayDiff(ms);
    if (d === 0) return "Today";
    if (d === 1) return "Tomorrow";
    if (d === -1) return "Yesterday";
    return TZ_DAY.format(new Date(ms));
  }
  function relLabel(ms) {
    var day = calendarDayDiff(ms);
    var u = Math.round((ms - Date.now()) / 60000);
    if (day > 0) {
      if (u < 60 * 24) return "in " + Math.max(1, Math.round(u / 60)) + " hr";
      return "in " + day + " day" + (day > 1 ? "s" : "");
    }
    if (day < 0) return Math.abs(day) + " day" + (Math.abs(day) > 1 ? "s" : "") + " late";
    if (u < -1) return Math.abs(u) + " min late";
    if (u <= 0) return "due now";
    if (u < 60) return "in " + u + " min";
    return "in " + Math.round(u / 60) + " hr";
  }

  /* ─── status vocabulary (mirrors shared/lib/orderStatus) ─── */
  var STAGES = ["placed", "confirmed", "ready"];
  var STAGE_META = {
    placed:    { key: "placed",    label: "New",     api: "Pending" },
    confirmed: { key: "confirmed", label: "Cooking", api: "Confirmed" },
    ready:     { key: "ready",     label: "Ready",   api: "Ready" }
  };
  var LOOKUP = { pending: "placed", placed: "placed", new: "placed", confirmed: "confirmed", preparing: "confirmed", ready: "ready" };
  function stageOf(s) { return LOOKUP[String(s || "").trim().toLowerCase()] || "placed"; }
  /* The verb belongs to where the order IS, not where it is going. */
  var VERB = { placed: "Accept", confirmed: "Mark ready", ready: "Mark collected" };
  function advanceOf(t) {
    var from = stageOf(t.status);
    if (from === "ready") return { to: "collected", stage: null, label: "Mark collected" };
    var to = STAGES[STAGES.indexOf(from) + 1];
    return { to: STAGE_META[to].api, stage: to, label: VERB[from] };
  }

  /* Order code — DD.MM.TT.NNN.  TT: 00 dine-in · 01 takeaway · 02 delivery.
     NNN is the running order number for the day, so two orders never read alike. */
  var TYPE_CODE = { DineIn: "00", Takeaway: "01", Delivery: "02" };
  var TYPE_LABEL = { DineIn: "Dine in", Takeaway: "Takeaway", Delivery: "Delivery" };
  function orderCode(t) {
    var d = tzParts(t.createdMs); /* the shop's calendar day, not the device's */
    return pad(d.day, 2) + "." + pad(d.month, 2) + "." + (TYPE_CODE[t.orderType] || "01") + "." + pad(t.seq, 3);
  }

  /* Urgency comes from the promised pickup time — every order now carries one,
     so "late" means the same thing to the wok and to the front counter. */
  var DUE_SOON_MINUTES = 10;
  function minutesUntilWanted(t) { return Math.round((t.wantedAt - Date.now()) / 60000); }
  function urgencyOf(t) {
    var u = minutesUntilWanted(t);
    if (u < 0) return "late";
    if (u <= DUE_SOON_MINUTES) return "warning";
    return "normal";
  }

  /* Money, as the shop needs to read it. */
  function readPayment(status, method) {
    var s = String(status || "").toLowerCase(), m = String(method || "").toLowerCase();
    if (s === "succeeded") return { label: "Paid online", attention: false };
    if (s === "failed") return { label: "Declined", attention: true };
    if (s === "processing" || s === "requiresaction") return { label: "Payment unfinished", attention: true };
    if (m === "cash") return { label: "Pay at counter", attention: false };
    return { label: "Payment not taken", attention: true };
  }

  /* ─── board data (demo board — real menu lines, AUD, en-AU) ─── */
  var NOW = Date.now();
  function item(id, name, qty, opts) {
    opts = opts || {};
    return {
      id: id, name: name, quantity: qty,
      modifiers: opts.modifiers || null,
      specialInstructions: opts.special || null,
      kitchenNote: opts.note || null,
      noteBy: opts.note ? "Linh Tran" : null,
      isCompleted: !!opts.done
    };
  }

  var TICKETS = [
    { id: 43, seq: 43, orderType: "Takeaway", status: "Confirmed", customerName: "Marcus Lee", customerPhone: "0466 330 512",
      ageMinutes: 28, isScheduled: false, paymentStatus: "failed", paymentMethod: "card", allergyDeclaration: null, notes: null,
      isHeld: false, items: [
        item(101, "Mix veg in cashew nut (Beef)", 1, { note: "out of beansprouts, used cabbage" }),
        item(102, "Honey Chicken", 1, { done: true }),
        item(103, "Spring roll (serve of 3)", 2)

  /* unit prices from the printed menu — display only, the server re-prices */
  var PRICE_BY_NAME = {
    "Cold rolls (serve of 4)": 8.50, "Homemade Dimsim (serve of 3)": 6.00, "Satay skewers (serve of 3)": 7.80,
    "Spring roll (serve of 3)": 5.80, "Pho - Beef noodle soup (1 choice)": 15.50, "Pho - Beef noodle soup (Combo)": 16.50,
    "Pad Thai": 16.00, "Crispy Pork (Roasted Pork) Banh Mi": 8.50, "Rice Bowl - Lemongrass Tofu": 14.50,
    "Salt & Pepper Tofu": 16.50, "Chicken noodle soup": 15.50, "Mix veg in cashew nut (Beef)": 19.80,
    "Honey Chicken": 18.00, "Salt & Pepper Squid / Fish": 18.50, "Steamed rice": 2.00,
    "Green bean in soy and garlic": 15.50
  };
  var MOD_BUMP = { "Extra protein": 4.00, "Extra soup": 3.00, "Extra rice/noodle": 2.00, "Extra sauce": 2.00 };

  function lineUnit(i) {
    var unit = PRICE_BY_NAME[i.name] || 0;
    if (i.modifiers && MOD_BUMP[i.modifiers]) unit += MOD_BUMP[i.modifiers];
    return unit;
  }
  function totalOf(t) {
    return Math.round(t.items.reduce(function (s, i) { return s + lineUnit(i) * i.quantity; }, 0) * 100) / 100;
  }
  function itemCount(t) { return t.items.reduce(function (s, i) { return s + i.quantity; }, 0); }

  /* Every order arrives with a pickup time. A counter order gets a prep estimate
     (created + 20 min); a booked order keeps its promised slot; a rare pre-order
     is pinned to a wall-clock tomorrow. */
  TICKETS.forEach(function (t) {
    t.createdMs = NOW - t.ageMinutes * 60000;
    t.total = totalOf(t);
    if (t.tomorrowClock) {
      var a = tzParts(NOW), d = new Date(Date.UTC(a.year, a.month - 1, a.day + 1));
      t.wantedAt = new Date(adelaideISO(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), t.tomorrowClock[0], t.tomorrowClock[1])).getTime();
    } else if (t.isScheduled) {
      t.wantedAt = t.createdMs + (t.wantedMinutes || 45) * 60000;
    } else {
      t.wantedAt = t.createdMs + 20 * 60000;
    }
    t.pos = t.id; /* arrival order → oldest first inside a column */
  });

  /* Counts LINES, not quantities — a line is binary (done / not done). */
  function progressOf(t) {
    return { done: t.items.filter(function (i) { return i.isCompleted; }).length, total: t.items.length };
  }
  function remainingOf(t) { return t.items.filter(function (i) { return !i.isCompleted; }).length; }

  /* ─── shared board store (localStorage) ───────────────────────────────────
     The board owns this store; the counter only ever posts new orders to an
     inbox. That one-way flow means a refresh keeps everything — drags, ticks,
     holds, pickup edits, collected orders — and a counter order taken in another
     tab lands on the line without either screen clobbering the other. */
  var STORE_KEY = "asiantaste.admin.board.v1";
  var INBOX_KEY = "asiantaste.admin.inbox.v1";

  function readJSON(key) { try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  function sameShopDay(a, b) {
    if (!a) return false;
    var x = tzParts(a), y = tzParts(b);
    return x.year === y.year && x.month === y.month && x.day === y.day;
  }

  function freshStore() {
    return { orders: TICKETS, history: [], collectedToday: 42, revenueToday: 1486.50, seq: 52, nextId: 900, savedAt: NOW };
  }

  function normalizeTicket(t) {
    if (t.createdMs == null) t.createdMs = Date.now() - (t.ageMinutes || 0) * 60000;
    if (t.wantedAt == null) t.wantedAt = t.createdMs + 20 * 60000;
    if (t.pos == null) t.pos = t.id;
    if (t.total == null) t.total = totalOf(t);
    t.ageMinutes = Math.max(0, Math.round((Date.now() - t.createdMs) / 60000));
    return t;
  }

  function save() {
    writeJSON(STORE_KEY, {
      orders: state.tickets, history: state.history,
      collectedToday: state.collectedToday, revenueToday: state.revenueToday,
      seq: state.seq, nextId: state.nextId, savedAt: Date.now()
    });
  }

  function loadStore() {
    var s = readJSON(STORE_KEY);
    /* A new trading day starts clean, the way a real till rolls over. */
    if (!s || !s.orders || !sameShopDay(s.savedAt, Date.now())) {
      s = freshStore();
      writeJSON(STORE_KEY, s);
    }
    state.tickets = s.orders.map(normalizeTicket);
    state.history = s.history || [];
    state.collectedToday = s.collectedToday || 0;
    state.revenueToday = s.revenueToday || 0;
    state.seq = s.seq || 0;
    state.nextId = s.nextId || 900;
  }

  /* Counter orders arrive here. The board assigns the board id and keeps the
     order number the counter promised. */
  function drainInbox() {
    var inbox = readJSON(INBOX_KEY);
    if (!inbox || !inbox.length) return false;
    var s = readJSON(STORE_KEY);
    if (!s || !s.orders) s = freshStore();
    inbox.forEach(function (tk) {
      tk.id = s.nextId++;
      tk.seq = tk.seq || (s.seq + 1);
      s.seq = Math.max(s.seq, tk.seq);
      normalizeTicket(tk);
      tk._isNew = true;
      s.orders.push(tk);
    });
    s.savedAt = Date.now();
    writeJSON(STORE_KEY, s);
    writeJSON(INBOX_KEY, []);
    return true;
  }

  /* ─── state ─── */
  var state = { filter: "live", tickets: TICKETS, history: [], collectedToday: 42, revenueToday: 1486.50, seq: 52, nextId: 900 };
  var FILTERS = [

    { id: "late", label: "Late" },

  ];
  function shownTickets() {
    return state.tickets.filter(function (t) {
      switch (state.filter) {
        case "live": return !t.isHeld;
        case "late": return !t.isHeld && urgencyOf(t) === "late";
        case "held": return t.isHeld;
        default: return true;
      }
    });
  }
  function filterCounts() {
    return {
      live: state.tickets.filter(function (t) { return !t.isHeld; }).length,
      late: state.tickets.filter(function (t) { return !t.isHeld && urgencyOf(t) === "late"; }).length,
      held: state.tickets.filter(function (t) { return t.isHeld; }).length,
      all: state.tickets.length
    };
  }

  /* ─── render: one card ─── */
  function whoLabel(t) {

  }
  function typeLabel(t) {
    if (t.orderType === "DineIn") return t.tableNumber ? "Dine in · Table " + t.tableNumber : "Dine in";
    return TYPE_LABEL[t.orderType] || "Takeaway";
  }
  function dishDetailHTML(i) {
    var parts = [];
    if (i.modifiers) parts.push(esc(i.modifiers));
    if (i.specialInstructions) parts.push(esc(i.specialInstructions));
    if (i.kitchenNote) parts.push('<span class="k">Kitchen:</span> ' + esc(i.kitchenNote) + (i.noteBy ? ' <span class="meta">(' + esc(i.noteBy) + ")</span>" : ""));

  }
  function restaurantNoteHTML(t) {
    var parts = [];
    if (t.allergyDeclaration) parts.push('<span class="allergy">' + esc(t.allergyDeclaration) + " allergy</span>");
    if (t.notes) parts.push(esc(t.notes));
    if (!parts.length) return "";

  function ticketHTML(t) {
    var stage = stageOf(t.status);
    var urgency = urgencyOf(t);
    var payment = readPayment(t.paymentStatus, t.paymentMethod);
    var action = advanceOf(t);
    var cls = "ticket" + (urgency === "late" ? " late" : urgency === "warning" ? " warn" : "") + (t.isHeld ? " held" : "");

    var h = '<article class="' + cls + '" data-ticket-id="' + t.id + '" data-od-id="ticket-' + t.id + '" data-stage="' + stage + '">';

    h += '<div class="t-head">' +
      '<button type="button" class="t-grip" data-drag-handle aria-label="Drag to move order ' + esc(orderCode(t)) + '">' + GRIP_SVG + "</button>" +
      '<span class="t-code">' + esc(orderCode(t)) + "</span>" +
      '<span class="t-type">' + esc(typeLabel(t)) + "</span></div>";

    h += '<div class="t-main"><span class="t-who">' + esc(whoLabel(t)) +
      (t.customerPhone ? '<span class="t-phone">' + esc(t.customerPhone) + "</span>" : "") +
      '</span><span class="t-total">' + money(t.total) + "</span></div>";

    /* Pickup time — the one line the kitchen runs on. Tap it to change it. */
    var day = dayLabel(t.wantedAt);
    h += '<button type="button" class="t-time' + (urgency === "late" ? " is-late" : urgency === "warning" ? " is-warn" : "") +
      '" data-pickup="' + t.id + '" aria-label="Edit pickup time, ' + esc(day + " " + fmtTime(t.wantedAt)) + '">' +
      CLOCK_SVG +

      "</button>";

    h += '<div class="t-sub"><span>' + t.ageMinutes + ' min on the line</span><span class="dot">·</span><span>' + num(itemCount(t)) +
      ' items</span></div>';

    var flags = "";
    if (payment.attention) flags += '<span class="t-flag pay">' + esc(payment.label) + "</span>";

      var detail = dishDetailHTML(i);
      h += '<div class="dish' + (i.isCompleted ? " is-done" : "") + '">' +
        '<div class="dish-row">' +
          '<button type="button" class="dish-tap" data-tick-item="' + i.id + '" data-tick-ticket="' + t.id + '" aria-pressed="' + i.isCompleted + '">' +
            '<span class="dish-qty">' + i.quantity + "×</span>" +
            '<span class="dish-name">' + esc(i.name) + "</span>" +

            'aria-label="' + (i.kitchenNote ? "Edit" : "Add") + " a kitchen note for " + esc(i.name) + '">' + NOTE_SVG + "</button>" +
        "</div>" +
        (detail ? '<p class="dish-detail">' + detail + "</p>" : "") +
      "</div>";
    });
    h += "</div>";
    if (allDone) h += '<p class="t-alldone">Every dish done — ready to hand over.</p>';

    h += '<div class="t-foot">' +
      '<button type="button" class="btn btn-sm btn-advance" data-advance="' + t.id + '">' + esc(action.label) + "</button>" +

        ? '<button type="button" class="t-act" data-resume="' + t.id + '" title="Put back on the line">' + HOLD_SVG + "Resume</button>"

  function renderBoard() {
    var shown = shownTickets();
    if (!shown.length) {
      columnsEl.innerHTML = '<p class="board-empty" style="grid-column:1/-1">Nothing in this filter. ' +
        (state.filter === "late" ? "No order is past its time." : state.filter === "held" ? "No order is held." : "") + "</p>";
      return;
    }
    columnsEl.innerHTML = STAGES.map(function (key) {
      var meta = STAGE_META[key];
      var list = shown.filter(function (t) { return stageOf(t.status) === key; })
        .sort(function (a, b) { return a.pos - b.pos; });
      var body = list.length
        ? list.map(ticketHTML).join("")
        : '<p class="board-empty">Nothing here.</p>';
      return '<div class="col" data-stage="' + key + '" data-od-id="board-col-' + key + '">' +
        '<div class="col-head"><h3>' + meta.label + '</h3><span class="count">' + list.length + "</span></div>" +
        '<div class="col-scroll">' + body + "</div></div>";
    }).join("");
  }

  function ticketById(id) { for (var i = 0; i < state.tickets.length; i++) if (state.tickets[i].id === id) return state.tickets[i]; return null; }

  function openHold(id) {

      '<label class="counter-note-field"><span>Why is it held? (the next person reads this)</span>' +

  /* ─── pickup time editor ──────────────────────────────────────────────────
     Opens on the order's current promised time, shows the shop's real clock,
     and puts hour + minute first — most orders move by minutes, so the
     steppers and 0–2h chips are the fast path; another day is the rare case. */
  var pickupDraft = 0;
  function pickupBodyHTML() {
    var now = Date.now();
    var day = calendarDayDiff(pickupDraft);
    var p = tzParts(pickupDraft);
    var hour12 = (p.hour % 12) || 12;
    var ampm = p.hour < 12 ? "am" : "pm";
    return '<div class="pick">' +
      '<p class="pick-now"><span class="pick-now-label">Now</span><strong>' + esc(fmtTime(now)) + '</strong><span class="pick-tz">Adelaide</span></p>' +
      '<div class="pick-preview">' +
        '<span class="pick-time">' + esc(fmtTime(pickupDraft)) + '</span>' +
        '<span class="pick-meta"><span class="pick-day">' + esc(dayLabel(pickupDraft)) + '</span><span class="dot">·</span>' + esc(relLabel(pickupDraft)) + '</span>' +
      '</div>' +
      (modalTicket && modalTicket.wantedAt ? '<p class="pick-was">Currently promised <strong>' + esc(fmtTime(modalTicket.wantedAt)) + '</strong></p>' : "") +
      '<div class="pick-quick" role="group" aria-label="Push the pickup time">' +
        '<button type="button" class="pick-chip" data-pick-add="15">+15 min</button>' +
        '<button type="button" class="pick-chip" data-pick-add="30">+30 min</button>' +
        '<button type="button" class="pick-chip" data-pick-add="60">+1 hr</button>' +
        '<button type="button" class="pick-chip" data-pick-add="120">+2 hr</button>' +
        '<button type="button" class="pick-chip" data-pick-now>Now</button>' +
      '</div>' +
      '<div class="pick-steppers">' +
        '<div class="pick-step"><span class="pick-step-label">Hour</span><div class="pick-step-ctl">' +
          '<button type="button" class="pick-round" data-pick-step="hour" data-dir="-1" aria-label="One hour earlier">−</button>' +
          '<span class="pick-step-val">' + hour12 + '<span class="pick-ampm">' + ampm + '</span></span>' +
          '<button type="button" class="pick-round" data-pick-step="hour" data-dir="1" aria-label="One hour later">+</button>' +
        '</div></div>' +
        '<div class="pick-step"><span class="pick-step-label">Minute</span><div class="pick-step-ctl">' +
          '<button type="button" class="pick-round" data-pick-step="minute" data-dir="-1" aria-label="Five minutes earlier">−</button>' +
          '<span class="pick-step-val">' + pad(p.minute, 2) + '</span>' +
          '<button type="button" class="pick-round" data-pick-step="minute" data-dir="1" aria-label="Five minutes later">+</button>' +
        '</div></div>' +
      '</div>' +
      '<div class="seg-sm pick-dayrow" role="group" aria-label="Pickup day">' +
        '<button type="button" data-pick-day="0" aria-pressed="' + (day === 0) + '">Today</button>' +
        '<button type="button" data-pick-day="1" aria-pressed="' + (day === 1) + '">Tomorrow</button>' +
      '</div>' +
      '<p class="pick-hint">Most orders move by 15–120 min. Pick Tomorrow only for a pre-order.</p>' +
    '</div>';
  }
  function renderPickupDraft() { modalBody.innerHTML = pickupBodyHTML(); }
  function pickupAdd(mins) { pickupDraft = Date.now() + mins * 60000; renderPickupDraft(); }
  function pickupStep(unit, dir) { pickupDraft += dir * (unit === "hour" ? 60 : 5) * 60000; renderPickupDraft(); }
  function pickupSetDay(offset) {
    var a = tzParts(Date.now()), p = tzParts(pickupDraft);
    var d = new Date(Date.UTC(a.year, a.month - 1, a.day + offset));
    pickupDraft = new Date(adelaideISO(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate(), p.hour, p.minute)).getTime();
    renderPickupDraft();
  }
  function openPickup(id) {
    modalTicket = ticketById(id);
    if (!modalTicket) return;
    pickupDraft = Date.now(); /* the editor opens on now — nudge from there */
    openModal("pickup", "Pickup time — " + orderCode(modalTicket),
      pickupBodyHTML(),
      '<button type="button" class="btn btn-ghost" data-modal-cancel>Cancel</button>' +
      '<button type="button" class="btn btn-primary" id="pickupConfirm">Save time</button>');
    document.getElementById("pickupConfirm").focus();
  }

  function confirmModalAction() {
    if (modalKind === "hold") {
      var reason = document.getElementById("holdReason").value.trim();
      if (!reason) return;
      modalTicket.isHeld = true; modalTicket.heldReason = reason; modalTicket.heldBy = "Linh Tran";
      var orderNo = orderCode(modalTicket);
      closeModal(); render(); save(); toast(orderNo + " held — it is off the line");
    } else if (modalKind === "note") {
      var note = document.getElementById("noteReason").value.trim();
      modalItem.kitchenNote = note || null;
      modalItem.noteBy = note ? "Linh Tran" : null;
      closeModal(); render(); save(); toast(note ? "Note saved to the kitchen" : "Note cleared");
    } else if (modalKind === "pickup") {
      var t = modalTicket, code = orderCode(t);
      t.wantedAt = pickupDraft; t.isScheduled = true;
      closeModal(); render(); save();
      toast("Pickup time for " + code + " set to " + fmtTime(t.wantedAt) + (dayLabel(t.wantedAt) !== "Today" ? " " + dayLabel(t.wantedAt) : ""));
    }
  }

  /* ─── actions ─── */
  function advance(id) {
    var t = ticketById(id);
    if (!t) return;
    var action = advanceOf(t);
    if (action.to === "collected") {
      state.tickets = state.tickets.filter(function (x) { return x.id !== id; });
      state.collectedToday += 1;
      state.revenueToday = Math.round((state.revenueToday + t.total) * 100) / 100;
      t.status = "Completed"; t.collectedMs = Date.now();
      state.history.unshift(t);
      toast(orderCode(t) + " collected — " + money(t.total) + " recorded");
    } else {
      t.status = action.to;
      toast(orderCode(t) + (action.stage === "confirmed" ? " accepted — on the wok" : " is ready for collection"));
    }
    render(); save();
  }

  function tickItem(ticketId, itemId) {
    var t = ticketById(ticketId);
    if (!t) return;
    var item = null;
    t.items.forEach(function (i) { if (i.id === itemId) item = i; });
    if (!item) return;
    item.isCompleted = !item.isCompleted;
    if (progressOf(t).done === progressOf(t).total) {
      toast("Every dish done — " + orderCode(t) + " is ready, call the number out");
    }
    render(); save();
  }

  /* ─── pointer drag & drop (works for mouse AND touch — iPad) ─── */
  var drag = null, slotEl = null, dropTarget = null;

  function ensureSlot() {
    if (slotEl) return;
    slotEl = document.createElement("div");
    slotEl.className = "drop-slot";
  }
  function showFocus(el) { if (el) el.focus({ preventScroll: true }); }

  function columnAt(x, y) {
    var cols = columnsEl.querySelectorAll(".col");
    var best = null, bestDist = Infinity;
    for (var i = 0; i < cols.length; i++) {
      var r = cols[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cols[i];
      var cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
      var d = Math.abs(x - cx) + Math.abs(y - cy);
      if (d < bestDist) { bestDist = d; best = cols[i]; }
    }
    return best;
  }
  function clearDrop() {
    if (slotEl && slotEl.parentNode) slotEl.parentNode.removeChild(slotEl);
    var cols = columnsEl.querySelectorAll(".col");
    for (var i = 0; i < cols.length; i++) cols[i].classList.remove("drop-target");
    dropTarget = null;
  }
  function updateDrop(x, y) {
    var col = columnAt(x, y);
    if (!col) { clearDrop(); return; }
    ensureSlot();
    var scroll = col.querySelector(".col-scroll");
    var cards = scroll.querySelectorAll(".ticket:not(.is-source)");
    var index = cards.length;
    for (var i = 0; i < cards.length; i++) {
      var cr = cards[i].getBoundingClientRect();
      if (y < cr.top + cr.height / 2) { index = i; break; }
    }
    var ref = cards[index] || null;
    scroll.insertBefore(slotEl, ref);
    for (var j = 0; j < columnsEl.children.length; j++) {
      columnsEl.children[j].classList.toggle("drop-target", columnsEl.children[j] === col);
    }
    dropTarget = {
      stage: col.getAttribute("data-stage"),
      index: index,
      ids: Array.prototype.map.call(cards, function (c) { return Number(c.getAttribute("data-ticket-id")); })
    };
    /* auto-scroll the column when the pointer nears an edge */
    var or = scroll.getBoundingClientRect();
    if (y < or.top + 44) scroll.scrollTop -= 12;
    else if (y > or.bottom - 44) scroll.scrollTop += 12;
  }

  function beginDrag(card, e) {
    var rect = card.getBoundingClientRect();
    var ghost = card.cloneNode(true);
    ghost.removeAttribute("data-ticket-id");
    ghost.className = card.className + " drag-ghost";
    ghost.style.width = rect.width + "px";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    document.body.appendChild(ghost);
    card.classList.add("is-source");
    drag = { id: Number(card.getAttribute("data-ticket-id")), card: card, ghost: ghost, dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    document.body.classList.add("is-dragging");
    document.addEventListener("pointermove", onDragMove, { passive: false });
    document.addEventListener("pointerup", onDragEnd);
    document.addEventListener("pointercancel", onDragEnd);
    updateDrop(e.clientX, e.clientY);
  }
  function onDragMove(e) {
    if (!drag) return;
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.dx) + "px";
    drag.ghost.style.top = (e.clientY - drag.dy) + "px";
    updateDrop(e.clientX, e.clientY);
  }
  function onDragEnd() {
    if (!drag) return;
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragEnd);
    document.removeEventListener("pointercancel", onDragEnd);
    document.body.classList.remove("is-dragging");
    if (drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);

    var moved = dropTarget;
    clearDrop();
    var t = ticketById(drag.id);
    var card = drag.card;
    drag = null;
    if (card) card.classList.remove("is-source");
    if (!t || !moved) { render(); return; }

    var fromStage = stageOf(t.status);
    var ids = moved.ids.slice();
    ids.splice(moved.index, 0, t.id);
    ids.forEach(function (id, i) {
      var x = ticketById(id);
      if (!x) return;
      x.pos = i + 1;
      x.status = STAGE_META[moved.stage].api;
    });
    render(); save();
    if (fromStage !== moved.stage) {
      toast(orderCode(t) + " → " + STAGE_META[moved.stage].label);
    }
  }

  columnsEl.addEventListener("pointerdown", function (e) {
    var grip = e.target.closest("[data-drag-handle]");
    if (!grip) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var card = grip.closest("[data-ticket-id]");
    if (!card) return;
    showFocus(grip);
    beginDrag(card, e);
  });

  /* ─── click actions (delegated) ─── */
  filtersEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]");
    if (!b) return;
    state.filter = b.getAttribute("data-filter");
    render();
  });

  columnsEl.addEventListener("click", function (e) {
    var adv = e.target.closest("[data-advance]");
    if (adv) { advance(Number(adv.getAttribute("data-advance"))); return; }

    var tick = e.target.closest("[data-tick-item]");
    if (tick) { tickItem(Number(tick.getAttribute("data-tick-ticket")), Number(tick.getAttribute("data-tick-item"))); return; }

    var note = e.target.closest("[data-note-item]");
    if (note) { openNote(Number(note.getAttribute("data-note-ticket")), Number(note.getAttribute("data-note-item"))); return; }

    var hold = e.target.closest("[data-hold]");
    if (hold) { openHold(Number(hold.getAttribute("data-hold"))); return; }

    var resume = e.target.closest("[data-resume]");
    if (resume) {
      var rt = ticketById(Number(resume.getAttribute("data-resume")));
      if (rt) { rt.isHeld = false; rt.heldReason = null; rt.heldBy = null; render(); save(); toast(orderCode(rt) + " back on the line"); }
      return;
    }

    var pickup = e.target.closest("[data-pickup]");
    if (pickup) { openPickup(Number(pickup.getAttribute("data-pickup"))); return; }
  });

  modalScrim.addEventListener("click", closeModal);
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalFoot.addEventListener("click", function (e) {
    if (e.target.closest("[data-modal-cancel]")) { closeModal(); return; }
    if (e.target.closest("#holdConfirm") || e.target.closest("#noteConfirm") || e.target.closest("#pickupConfirm")) confirmModalAction();
  });
  modalBody.addEventListener("click", function (e) {
    if (modalKind !== "pickup") return;
    var add = e.target.closest("[data-pick-add]");
    if (add) { pickupAdd(Number(add.getAttribute("data-pick-add"))); return; }
    if (e.target.closest("[data-pick-now]")) { pickupAdd(0); return; }
    var step = e.target.closest("[data-pick-step]");
    if (step) { pickupStep(step.getAttribute("data-pick-step"), Number(step.getAttribute("data-dir"))); return; }
    var day = e.target.closest("[data-pick-day]");
    if (day) { pickupSetDay(Number(day.getAttribute("data-pick-day"))); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (modalShell.hidden) return;
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key !== "Tab") return;
    var focusable = Array.prototype.filter.call(
      modalPanel.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'),
      function (el) { return el.offsetParent !== null; }
    );
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* rail collapse + account menu */
  document.getElementById("railToggle").addEventListener("click", function () {
    var admin = document.getElementById("admin");
    var collapsed = admin.getAttribute("data-rail") === "collapsed";
    admin.setAttribute("data-rail", collapsed ? "expanded" : "collapsed");
    this.setAttribute("aria-expanded", String(collapsed));
    document.getElementById("railChevron").setAttribute("d", collapsed ? "m14 6-6 6 6 6" : "m10 6 6 6-6 6");
  });
  document.getElementById("accountBtn").addEventListener("click", function () {
    var menu = document.getElementById("accountMenu");
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".admin-account")) {
      document.getElementById("accountMenu").hidden = true;
      document.getElementById("accountBtn").setAttribute("aria-expanded", "false");
    }
  });

  /* ─── the shop clock + live countdowns ─── */
  var clockEl = document.getElementById("adminClock");
  function renderClock() { if (clockEl) clockEl.textContent = "Adelaide " + fmtTime(Date.now()); }
  function tickTimes() {
    if (drag || !modalShell.hidden) return; /* never disturb a drag or an open dialog */
    var nodes = columnsEl.querySelectorAll("[data-pickup]");
    Array.prototype.forEach.call(nodes, function (btn) {
      var t = ticketById(Number(btn.getAttribute("data-pickup")));
      if (!t) return;
      var rel = btn.querySelector(".t-time-rel");
      if (rel) rel.textContent = relLabel(t.wantedAt);
      btn.classList.toggle("is-late", urgencyOf(t) === "late");
      btn.classList.toggle("is-warn", urgencyOf(t) === "warning");
    });
  }
  setInterval(function () { renderClock(); tickTimes(); }, 30000);

  /* ─── boot ─── */
  drainInbox();
  loadStore();
  renderClock();
  render();

  /* Other tabs (the counter, a second board) write to the store; re-read and
     repaint when they do, so every screen shows the same line. */
  function refresh() {
    if (drag || !modalShell.hidden) return;
    drainInbox();
    loadStore();
    render();
  }
  window.addEventListener("storage", function (e) {
    if (e.key === STORE_KEY || e.key === INBOX_KEY) refresh();
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  window.addEventListener("focus", refresh);
})();
</script>
</body>
</html>
